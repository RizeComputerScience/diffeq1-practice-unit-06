/* Colors and fonts come from the course theme (interactive/themes/<name>.css), injected by build.py. */

.chip{font-size:26px;min-height:62px;padding:6px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;transition:border-color .15s,transform .15s}

/* rule */
.rule{margin:44px 0 0;padding:48px 32px 40px;background:var(--surface);border:2px solid var(--ink);border-radius:18px;text-align:center;position:relative}

.memo span::after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-8px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid var(--outside)}
.rule-eq{white-space:nowrap;overflow-x:auto;font-size:clamp(19px,4.4vw,42px);line-height:1.4;padding:22px 12px;background:var(--bg);border-radius:12px}

/* why */
.whyd{margin:44px auto 0;max-width:760px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:4px 24px}
.whyd summary,.hintd summary{list-style:none}

.opt{font-weight:400;color:var(--muted)}
.chev{margin-left:auto;width:12px;height:12px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:translateY(-3px) rotate(45deg);transition:transform .2s;flex:none}
details[open] > summary .chev{transform:translateY(3px) rotate(225deg)}
.hintd summary{gap:10px}
.hintd summary .chev{margin-left:0;width:9px;height:9px;border-width:2px}

/* forms */
.forms{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 26px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.3fr);gap:14px;align-items:baseline;padding:14px 0;border-top:1px solid var(--line);font-size:26px}
.frow:first-child{border-top:0}
.fl{text-align:right}

/* exam */
.exam-q{font-size:23px}
.msol{margin:16px 0 0;padding-left:1.3em;font-size:21px}
.msol li{margin-bottom:10px}
.self{border:1px solid var(--line);border-radius:12px;padding:12px 18px 8px;margin:20px 0 0}
.self legend{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--muted);padding:0 6px}
.ck{display:flex;align-items:center;gap:12px;min-height:46px;font-family:var(--sans);font-size:18px;cursor:pointer}
.ck input{width:22px;height:22px;accent-color:var(--ink);flex:none}
/* close */
.closer h3{font-size:28px;margin:8px 0 14px}
.closer .rules{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 22px}
.reads{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;font-size:20px}
.reveal{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes lift{0%{background:transparent}40%{background:var(--inside-tint);box-shadow:0 0 0 6px var(--inside-tint)}100%{background:var(--inside-tint)}}
@keyframes fadein{from{opacity:.3}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
@media (max-width:860px){.toc{display:none}}
@media (max-width:900px){.srow,.srow.fixrow{grid-template-columns:24px minmax(0,1fr)}.snum{padding-top:2px}.slabel{padding-top:0}.sval,.fixcol{grid-column:2}.fixbtn{width:auto}}
@media (max-width:640px){
body{font-size:19px}

}

/* ================= v2 (F01, 2026-10-10) =================
   Engine-generic rules that used to live in Unit 2's page.css, copied verbatim and in their original order,
   so every page gets fractions, choices, cards, tables and the Memorize box without a page.css of its own. */
/* stacked fractions: inline-block in ordinary flow, never flex or grid */
.fr{display:inline-block;vertical-align:middle;text-align:center;line-height:1.08;margin:0 .1em;font-size:.86em}

.fr > .fd{padding-top:.06em}

.fr.op{font-size:.8em}
.fr .mv{padding-right:0}
.dd{font-style:normal}
.rt{color:var(--rate);font-weight:600}
.k .fr{background:transparent}
.ml{white-space:nowrap}
.mline{display:block;white-space:nowrap;padding:3px 0}
.mline + .mline{border-top:1px dashed var(--line)}
.marr{display:block;color:var(--muted);font-family:var(--sans);font-size:15px;line-height:1;padding:2px 0 2px 6px}
/* emblem */
.emb-math{font-size:clamp(30px,6.4vw,64px);line-height:1.5;white-space:nowrap;text-align:center}
.emb-sub{font-size:clamp(19px,3.4vw,30px);color:var(--muted);text-align:center;padding:0 8px}
.sw-rate{background:var(--rate-tint);border-bottom:3px solid var(--rate)}
.sw-k{background:var(--k-tint);border-bottom:3px solid var(--k-line)}
.leg-rate b{color:var(--rate)}
/* choice lists */
.choices{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.choice{display:block;width:100%;text-align:left;font-family:var(--serif);font-size:20px;line-height:1.45;min-height:56px;padding:12px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.choice:hover{border-color:var(--ink)}
.choice.picked-ok{border-color:var(--ok);background:var(--ok-tint)}
.choice.picked-no{border-color:var(--outside);border-style:dashed}
.choice:disabled{cursor:default}
.choice .mn,.choice .mv,.choice .mf,.choice .mo{font-size:22px}
.sbox.multi{white-space:normal;overflow-x:auto}
.why{font-family:var(--sans);font-size:15px;color:var(--muted);margin-top:6px}
.why .mn,.why .mv,.why .mf,.why .mo{font-size:17px}
.mcrow{display:flex;flex-direction:column;gap:8px}
.mcrow .choice{min-height:52px;font-size:20px;padding:8px 14px}
.ptext{font-size:22px;line-height:1.5;margin:0 0 18px}
.pfig{margin:0 0 18px}
.pfig svg{display:block;width:100%;max-width:320px;height:auto;margin:0 auto}
.pfig svg text{fill:var(--ink)}
@media (max-width:640px){.ptext{font-size:20px}.choice{font-size:19px}}
.k + sup.ms{margin-left:-.06em}
svg text{font-family:var(--serif);fill:var(--ink)}
svg .lab{font-style:normal;font-size:19px}
svg .num{font-size:16px;fill:var(--muted)}
.marr{font-size:19px;padding:2px 0 2px 10px}
.ml.nb .eq{white-space:nowrap}
.marr{font-size:22px;padding:2px 0 2px 18px}
.ml.nb{display:inline-block}
.in{color:var(--inside)}
span.in{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-skip-ink:none}
.fr span.in{text-underline-offset:3px}
.out{color:var(--outside)}
.sw-out2{background:var(--outside-tint);border-bottom:3px solid var(--outside)}
.emb-math{font-size:clamp(26px,5.6vw,52px)}
.emb-sub{max-width:28em;margin:0 auto}
.disp{text-align:center;font-size:clamp(28px,5vw,40px);margin:18px 0 8px}
.ctitle{font-family:var(--sans);font-size:17px;font-weight:700;color:var(--muted);margin:0 0 14px}
.ctitle .mn,.ctitle .mv,.ctitle .mo,.ctitle .pr{font-size:19px;font-weight:400}
.workbox{font-size:clamp(18px,2.9vw,23px);padding:12px 18px}
.workbox .mline{padding:6px 0}
.note.small,.small-sans{font-family:var(--sans);font-size:16px;color:var(--muted)}

.ans-end{display:inline-flex;align-items:center;gap:10px;flex:0 1 auto;min-width:0}

/* ---------- v2 notation (lesson-core.js mth) ---------- */
.mn.me{font-style:normal}
.msb{font-size:.7em;line-height:1;vertical-align:-.3em}
.lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:baseline;line-height:1.15;margin-right:.2em}
.lim-s{font-size:.6em;line-height:1;white-space:nowrap;margin-top:.02em}
.lim-s .ms{font-size:.85em;vertical-align:.5em}
.int{white-space:nowrap;margin-right:.1em}
.int-s{font-family:var(--math);font-size:1.7em;line-height:1;vertical-align:-.28em;font-style:normal}
.int-l{display:inline-flex;flex-direction:column;justify-content:space-between;align-items:flex-start;vertical-align:middle;height:2.9em;font-size:.6em;line-height:1;margin-left:-.05em}
.int-b{margin-top:-.35em}.int-a{margin-bottom:-.5em;margin-left:-.35em}
.sum{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .14em}
.sum-s{font-family:var(--math);font-size:1.5em;line-height:1}
.sum-a,.sum-b{font-size:.6em;white-space:nowrap;line-height:1.1}
.evb{display:inline-flex;flex-direction:column;justify-content:space-between;align-items:flex-start;vertical-align:middle;height:3.1em;font-size:.6em;line-height:1;border-left:.13em solid currentColor;padding-left:.22em;margin-left:.12em}
.abs > .mn:first-child{padding-right:.05em}.abs > .mn:last-child{padding-left:.05em}
.dif .mv{padding-right:0}
.fr .lim,.fr .int{font-size:1em}
.mf.fs{padding-right:.2em}
/* scripts under lim, beside ∫, around Σ and on the bar keep their small size even where a container fixes math spans in px */
.lim-s *,.int-l *,.sum-a *,.sum-b *,.evb *,sub.msb *{font-size:inherit !important}
/* v2 pages (mount without legacy): superscripts stay small inside choices, feedback, hints and card titles */
.v2 sup.ms *{font-size:inherit !important}
.v2 .ctitle .ms{font-size:.7em}
.rule-line{display:block}

/* ---------- v2 components (components.js) ---------- */
/* SharedBadge, card header */
.shared-badge{display:inline-flex;align-items:center;font-family:var(--sans);font-size:14px;font-weight:700;line-height:1.3;color:var(--ink);background:var(--k-tint);border:1.5px solid var(--k-line);border-radius:999px;padding:4px 12px}
.ctop{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:0 0 14px}
.ctop .ctitle{margin:0}
/* VariationCard */
.vc-idea{font-family:var(--sans);font-size:17px;color:var(--muted);margin:-6px 0 8px}
.vc-count{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--muted);margin:0 0 6px}
.vc-list{list-style:none;counter-reset:vc;margin:0;padding:0}
.vc-item{counter-increment:vc;position:relative;padding:22px 0 8px 42px;border-top:1px solid var(--line)}
.vc-item::before{content:counter(vc);position:absolute;left:0;top:22px;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);font-family:var(--sans);font-size:15px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.vc-item.done::before{content:'\2713';color:var(--ok);border-color:var(--ok);background:var(--ok-tint)}
.vc-item .ptext{font-size:20px}
/* Matcher */
.mt-how{font-family:var(--sans);font-size:16px;color:var(--muted);margin:0 0 12px}
.mt-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mt-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.mt-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-family:var(--serif);font-size:19px;line-height:1.4;min-height:56px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.mt-i:hover{border-color:var(--ink)}
.mt-i.sel{border-color:var(--inside);box-shadow:0 0 0 3px var(--inside-tint)}
.mt-i.done{border-color:var(--ok);background:var(--ok-tint);cursor:default}
.mt-n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ok);color:var(--bg);font-family:var(--sans);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.mt-body{flex:1 1 auto;min-width:0}
.mt-body svg{display:block;width:100%;max-width:220px;height:auto;margin:0 auto}
.mt-body svg text{fill:var(--ink);font-family:var(--math);font-size:15px}
.mt-count{font-family:var(--sans);font-size:15px;color:var(--muted);margin:12px 0 0}
/* Slider and Toggle */
.sl{margin:14px 0 8px}
.sl-lab{display:block;font-family:var(--sans);font-size:16px;font-weight:600;color:var(--ink);margin-bottom:2px}
.sl-lab .mn,.sl-lab .mv,.sl-lab .mo{font-size:19px}
.sl-row{display:flex;align-items:center;gap:14px}
.sl-in{flex:1 1 auto;min-width:0;height:44px;accent-color:var(--inside);margin:0}
.sl-out{flex:none;min-width:4.2em;text-align:right;font-family:var(--math);font-size:21px;font-variant-numeric:tabular-nums;color:var(--ink)}
.tg .zb .mn,.tg .zb .mv,.tg .zb .mo{font-size:17px}
/* GraphView (the theme puts .gv on the board) */
.gv{margin:0 0 18px;border-radius:12px;padding:12px}
.gv svg{display:block;width:100%;height:auto;max-width:560px;margin:0 auto;overflow:visible}
.gv svg text{fill:var(--ink);font-size:16px}
.gv svg text.num{fill:var(--muted)}
.gv svg text.n{font-family:var(--math)}
.gv svg .gv-lab{font-size:16px}
.gv svg .gv-sign{font-size:22px;font-weight:700;fill:var(--ink)}
.gv-drag{cursor:grab;outline:none;touch-action:none}
.gv-drag:focus-visible .gv-dot,.gv-drag:focus .gv-dot{stroke:var(--focus);stroke-width:4}
.gv-read{font-family:var(--sans);font-size:17px;text-align:center;margin:10px 0 0;min-height:1.6em}
.gv-read .mn,.gv-read .mv,.gv-read .mo,.gv-read .mf,.gv-read .pr{font-size:21px}
.gv-cap{font-family:var(--sans);font-size:16px;color:var(--muted);margin:8px 0 0}
.gv .zoombtns{justify-content:center}
/* TableBuilder */
.tb-wrap{overflow-x:auto;margin:18px 0 0;max-width:100%}
.avt.tb{width:auto;min-width:min(100%,300px)}

<body>
<div class="page" id="app"></div>
<script>
/*
 * mathkit.js: the math engine from the chain rule page, usable on its own.
 *
 * Works in the browser (window.MathKit) and in Node (require('./mathkit.js')).
 *
 *   const mk = new MathKit();
 *   mk.same(mk.cf('15(3x+1)^4'), mk.cf('5(3x+1)^4*3'))      // true: equivalence by sampling
 *   mk.parse('sin x^2')                                      // tree, or {err: 'friendly message'}
 *   mk.pr(mk.simp(mk.diff(mk.parse('ln(x^2+4)').ast)), 'x').s   // '1/(x^2 + 4) * 2x'
 *   mk.rich('Find `f(x) = «(»{3x + 1}«)^5»` at `x = ‹2›`')  // typeset segments (see math-typesetting.md)
 *   mk.judge({ ans: '2x', wrongs: [['x^2', 'forgot to differentiate']] }, studentText)
 *
 * CLI (validate answer keys while authoring):
 *   node mathkit.js same "15(3x+1)^4" "5(3x+1)^4*3"
 *   node mathkit.js diff "sqrt(ln(x^2+5))"
 *   node mathkit.js parse "e^2x"          # shows how an ambiguous input is read
 *
 * Scope: one variable, + - * / ^, implicit multiplication, sin cos tan sec csc cot
 * arcsin arccos arctan ln log sqrt exp abs, |..| absolute value bars, e, pi.
 * Equivalence is numeric: two expressions agree at 10 sample points (relative tolerance
 * 1e-6, at least 3 points where both are defined). Good for answer checking; not a proof.
 *
 * The variable (v2, 2026-10-10). The second argument to tok/parse/compile/cf is either
 *   - nothing or false: the variable is x;
 *   - true: the variable is u (kept for older pages);
 *   - a letter, such as 't': the variable is that letter;
 *   - an object { v: 't', params: ['c', 'y'] }: the variable is v, and each letter in params
 *     is read as a named constant whose value is supplied at evaluation time:
 *     compile(src, o).f(x, { c: 1, y: 2 }). Missing params evaluate to 0.
 * Input is lowercased first, so params and variables are lowercase letters.
 */
class MathKit {
  constructor() { this.fcache = {}; this.rcache = {}; this.D = { VOC: {} }; }
  /* normalize the variable option (see the header) */
  vo(uv) {
    if (uv && typeof uv === 'object') return { v: String(uv.v || 'x').toLowerCase(), params: (uv.params || []).map((p) => String(p).toLowerCase()) };
    if (typeof uv === 'string' && uv) return { v: uv.toLowerCase(), params: [] };
    return { v: uv ? 'u' : 'x', params: [] };
  }
  /* ---------- math reading: text to tree ---------- */
  tok(src, uv) {
    let bar = 0;
    const s = String(src).replace(/[−–—]/g, '-').replace(/[·×∙⋅]/g, '*').replace(/÷/g, '/').replace(/π/g, 'pi').replace(/√/g, 'sqrt').replace(/²/g, '^2').replace(/³/g, '^3').replace(/⁴/g, '^4').replace(/\*\*/g, '^').replace(/[\[{]/g, '(').replace(/[\]}]/g, ')')
      .replace(/\|/g, () => (bar++ % 2 === 0 ? ' (abs(' : '))')).toLowerCase();
    if (bar % 2) return { err: 'An absolute value bar “|” is missing its partner.' };
    const W = ['sqrt', 'arcsin', 'arccos', 'arctan', 'sin', 'cos', 'tan', 'sec', 'csc', 'cot', 'exp', 'abs', 'ln', 'log', 'pi'];
    const o = this.vo(uv), vname = o.v;
    const out = [];
    let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (c === ' ' || c === '\t') { i++; continue; }
      if (c === vname) { out.push({ t: 'x' }); i++; continue; }
      if (/[0-9.]/.test(c)) {
        let j = i;
        while (j < s.length && /[0-9.]/.test(s[j])) j++;
        const t = s.slice(i, j);
        if (t === '.' || (t.match(/\./g) || []).length > 1) return { err: 'The number “' + t + '” has a stray decimal point.' };
        out.push({ t: 'num', v: parseFloat(t) });
        i = j;
        continue;
      }
      if (/[a-z]/.test(c)) {
        const w = W.find((k) => s.startsWith(k, i));
        if (w) { i += w.length; if (w === 'pi') out.push({ t: 'pi' }); else out.push({ t: 'fn', v: w === 'log' ? 'ln' : w }); continue; }
        if (c === 'e') { out.push({ t: 'e' }); i++; continue; }
        if (o.params.indexOf(c) >= 0) { out.push({ t: 'p', v: c }); i++; continue; }
        if (vname === 'u' && c === 'x') return { err: 'Write this row using u, not x. Here u stands for the whole inside.' };
        return { err: 'This box uses ' + vname + ' as its only variable, so “' + c + '” is not something it can read.' };
      }
      if ('+-*/^()'.indexOf(c) >= 0) { out.push({ t: c }); i++; continue; }
      return { err: 'The symbol “' + c + '” is not something this box can read.' };
    }
    return { toks: out };
  }

  parse(src, uv) {
    if (!src || !String(src).trim()) return { empty: true };
    const r = this.tok(src, uv);
    if (r.err) return { err: r.err };
    const T = r.toks;
    let i = 0;
    const peek = () => T[i];
    const vn = this.vo(uv).v;
    const isF = (t) => !!t && (t.t === 'num' || t.t === 'x' || t.t === 'p' || t.t === 'e' || t.t === 'pi' || t.t === 'fn' || t.t === '(');
    const show = (t) => (t.t === 'fn' || t.t === 'p' ? t.v : t.t === 'num' ? String(t.v) : t.t === 'x' ? vn : t.t);
    const fail = (m) => { throw new Error(m); };
    const B = (k, a, b) => ({ k, a, b });
    let expr, term, unary, power, primary;
    expr = () => {
      let a = term();
      while (peek() && (peek().t === '+' || peek().t === '-')) { const op = T[i++].t; a = B(op, a, term()); }
      return a;
    };
    term = () => {
      let a = unary();
      for (;;) {
        const t = peek();
        if (t && (t.t === '*' || t.t === '/')) { i++; a = B(t.t, a, unary()); }
        else if (isF(t)) a = B('*', a, power());
        else break;
      }
      return a;
    };
    unary = () => {
      const t = peek();
      if (t && t.t === '-') { i++; return { k: 'neg', a: unary() }; }
      if (t && t.t === '+') { i++; return unary(); }
      return power();
    };
    power = () => {
      const b = primary();
      if (peek() && peek().t === '^') {
        i++;
        let e;
        if (peek() && peek().t === '-') { i++; e = { k: 'neg', a: power() }; } else e = power();
        return B('^', b, e);
      }
      return b;
    };
    primary = () => {
      const t = T[i];
      if (!t) fail('The expression ends too soon. Something is missing at the end.');
      if (t.t === 'num') { i++; return { k: 'n', v: t.v }; }
      if (t.t === 'x') { i++; return { k: 'v' }; }
      if (t.t === 'p') { i++; return { k: 'p', name: t.v }; }
      if (t.t === 'e') { i++; return { k: 'c', name: 'e', v: Math.E }; }
      if (t.t === 'pi') { i++; return { k: 'c', name: 'pi', v: Math.PI }; }
      if (t.t === '(') {
        i++;
        if (peek() && peek().t === ')') fail('There is an empty pair of parentheses.');
        const a = expr();
        if (!peek()) fail('A parenthesis is still open. Close it with “)”.');
        if (peek().t !== ')') fail('Something is out of place near “' + show(peek()) + '”.');
        i++;
        return a;
      }
      if (t.t === 'fn') {
        i++;
        let fe = null;

/* components.js: shared components for Rize lesson pages, any course (v2, 2026-10-10; step rail and annotations 2026-10-25).

/* ---------------- small helpers ---------------- */

var TINT = { ink: 'var(--soft)', muted: 'var(--soft)', line: 'var(--soft)', inside: 'var(--inside-tint)', outside: 'var(--outside-tint)', rate: 'var(--rate-tint)', k: 'var(--k-tint)', ok: 'var(--ok-tint)', bad: 'var(--bad-tint)' };

/* fmtNum(v): up to 6 decimals, trailing zeros dropped; fmtNum(v, 3): exactly 3 decimals; fmtNum(v, 3, true): at most 3 */
function fmtNum(v, dp, trim) { if (typeof v === 'string') return v.replace(/^-/, '−'); var s = (dp === undefined ? String(Math.round(v * 1e6) / 1e6) : v.toFixed(dp)); if (trim && s.indexOf('.') >= 0) s = s.replace(/\.?0+$/, ''); if (/^-0(\.0*)?$/.test(s)) s = s.slice(1); return s.replace(/^-/, '−'); }

/* faded(id, { title, intro, rows: [{ show: 'math' } | { item: 'id' }], gate: true, shared }): a worked example whose
   later rows are typed; with gate (the default) each typed row opens only after the one before is correct */
function faded(id, o) {
  var rows = o.rows, gate = o.gate !== false, out = '', blocked = false, ids = rows.filter(function (r) { return r.item; }).map(function (r) { return r.item; });
  ids.forEach(function (rid, k) { if (ITEMS[rid]) ITEMS[rid].nextId = ids[k + 1] || null; });
  var fixed = [];

  return card(o.title || '', (o.intro ? '<p class="ptext">' + P(o.intro) + '</p>' : '') + '<div class="srows faded">' + out + '</div>', id, { shared: o.shared });

/* ---------------- 3. TableBuilder ---------------- */
/* table(id, { caption, cols: ['`x`', '`f(x)`'], rows: [[1.9, '3.900'], [1.99, { item: 't-199' }], ...], dir: 'down' | 'across',
   highlight: 'last' | [row indexes], rowHead: true }) inside blk(name, ...); typed cells' items use that block name.
   A cell is a number or numeric string (decimal-aligned), a string with `math`, { item: id } (a typed answer),
   { echo: id, empty: 'your answer from above' } (repeats what the student typed in item id), or { html: '...' }. */
var TBS = {};
var NUMRE = /^\s*[−-]?\d*\.?\d+\s*$/;
function tbIsNum(c) { return typeof c === 'number' || (typeof c === 'string' && NUMRE.test(c)); }
function tbSplit(c) { var s = typeof c === 'number' ? String(c) : c.trim(); s = s.replace(/^-/, '−'); var p = s.split('.'); return [p[0], p.length > 1 ? '.' + p[1] : '']; }
function echoHTML(id, empty) { var v = S.ans[id] && S.ans[id].trim(); return v ? '<span class="mine">' + esc(v) + '</span>' : '<span class="tbd">' + esc(empty || 'your answer from above') + '</span>'; }
function table(id, o) {
  TBS[id] = o;
  var rows = o.rows, ncol = Math.max.apply(null, rows.map(function (r) { return r.length; }));
  /* column widths for decimal alignment (in ch), over the numeric cells of each data column */
  var wi = [], wf = [];
  for (var c = 0; c < ncol; c++) { wi[c] = 0; wf[c] = 0; rows.forEach(function (r) { if (tbIsNum(r[c])) { var sp = tbSplit(r[c]); wi[c] = Math.max(wi[c], sp[0].length); wf[c] = Math.max(wf[c], sp[1].length); } }); }
  function cell(x, c) {
    if (x === undefined || x === null) return '';
    if (tbIsNum(x)) { var sp = tbSplit(x); return '<span class="dn"><span class="dn-i" style="min-width:' + wi[c] + 'ch">' + sp[0] + '</span><span class="dn-f" style="min-width:' + wf[c] + 'ch">' + sp[1] + '</span></span>'; }
    if (typeof x === 'string') return P(x);
    if (x.item) { var it2 = ITEMS[x.item]; return '<span class="tb-cell"><input class="minput tb-in" id="in-' + x.item + '" data-id="' + x.item + '" value="' + esc(S.ans[x.item] || '') + '" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="decimal" aria-label="' + esc(it2.label || it2.ask || 'Your answer') + '">' +
      '<button type="button" class="btn sm tb-chk" data-act="check" data-id="' + x.item + '">Check</button>' + (S.done[x.item] ? '<span class="tb-ok" aria-hidden="true">✓</span>' : '') + '</span>'; }
    if (x.echo) return '<span data-echo="' + x.echo + '" data-empty="' + esc(x.empty || '') + '">' + echoHTML(x.echo, x.empty) + '</span>';
    if (x.html) return x.html;
    return esc(String(x));
  }
  var hl = function (r) { return o.highlight === 'last' ? r === rows.length - 1 : (o.highlight || []).indexOf(r) >= 0; };
  var items = [];
  rows.forEach(function (r) { r.forEach(function (x) { if (x && x.item) items.push(x.item); }); });
  var h = '<div class="tb-wrap"><table class="avt tb' + (o.dir === 'across' ? ' tb-across' : '') + '" id="' + id + '">' + (o.caption ? '<caption>' + P(o.caption) + '</caption>' : '');
  if (o.dir === 'across') {
    h += '<tbody>' + (o.cols || []).map(function (head, c) {
      return '<tr><th scope="row">' + P(head) + '</th>' + rows.map(function (r, n) { return '<td class="' + (tbIsNum(r[c]) ? 'nv' : '') + (hl(n) ? ' near' : '') + '">' + cell(r[c], c) + '</td>'; }).join('') + '</tr>';

          ['9', 'That is `F{k}{m}`. The test uses the product `4mk`.']],

      { lead: 'Classify the motion for `b = 20`.', ok: 0, pick: [
        ['Underdamped', '`b^2 = 400` is less than `4mk = 576`, so the roots are complex. The mass swings back and forth as its swings shrink.'],
        ['Critically damped', 'Critical damping needs `b^2 = 4mk` exactly, and `400 ≠ 576`.'],

      { lead: 'Classify the motion for `b = 30`.', ok: 0, pick: [
        ['Overdamped', '`b^2 = 900` is greater than `4mk = 576`, so the roots are real and negative. The mass returns to rest without swinging.'],
        ['Underdamped', 'Compare `b^2 = 900` with `4mk = 576`. Since 900 is larger, the roots are real, so the mass does not swing.'],
        ['Critically damped', 'Critical damping is `b = 24`. Here `b^2 = 900` is larger than `4mk = 576`.']] },
      { lead: 'Find both roots of `4r^2 + 30r + 36 = 0`. Type them with a comma between them.', ask: 'r =', list: true, ans: '-1.5, -6',

        hints: ['Here `b^2 − 4mk = 900 − 576 = 324`, and `sqrt(324) = 18`. Use `r = F{−30 ± 18}{8}`.'],
        sol: ['`r = F{−30 ± sqrt(900 − 576)}{8} = F{−30 ± 18}{8}`, so `r = −1.5` and `r = −6`'] },
      { lead: 'At critical damping, `b = 24`, the double root is `r = −3`. If both masses start from the same position at rest, which one gets close to rest sooner?', ok: 0, pick: [
        ['The critically damped one, with `b = 24`', 'Its solution is `(C_1 + C_2 t)e^(−3t)`. With `b = 30`, the root −1.5 gives a term `e^(−1.5t)`, which dies out more slowly.'],
        ['The overdamped one, because more friction means a faster return', 'Past critical damping, one root moves toward 0. Here `e^(−1.5t)` dies out more slowly than `e^(−3t)`.'],

        ['They settle equally fast', 'Compare the slowest exponentials: `e^(−3t)` for `b = 24` and `e^(−1.5t)` for `b = 30`.']] }],
    graph: { x: [0, 3], y: [0, 1.1], ticks: { x: 0.5, y: 0.2 },
      fns: [{ f: function (t) { return (1 + 3 * t) * Math.exp(-3 * t); }, role: 'inside', label: { x: 1.1, text: 'b = 24', at: 'sw' } },

  /* 3. an underdamped spring: alpha and beta, C_2 by the product rule, decay rate, halving time, quasi-period */
  { id: 'p3', sec: 'sec-damp', task: 'A 2 kg mass on a spring with `k = 52` N/m and damping coefficient `b = 4` N·s/m is pulled 0.5 m from rest and released.',
    board: ['2y″ + 4y′ + 52y = 0', 'y(0) = 0.5, y′(0) = 0'], v: 't', teach: T_UNDER,
    steps: [
      { lead: 'Here `b^2 − 4mk = 16 − 416 < 0`, so the spring is underdamped, and the roots of `2r^2 + 4r + 52 = 0` are `α ± βi`. Find `α`.', ask: 'α =', num: true, ans: '-1',
        wrongs: [['-2', 'The quadratic formula divides `−b` by `2a`, which here is `2m = 4`: `α = −F{4}{4}`.'],
          ['-4', 'Divide `−b` by `2m = 4`.'],
          ['1', 'The real part is `−F{b}{2m}`, which is negative for a spring with friction.']],
        hints: ['By the quadratic formula, the real part of the roots is `F{−b}{2m}`.'] },
      { lead: 'Find `β`.', ask: 'β =', num: true, ans: '5', tol: 0.011,
        wrongs: [['10', 'Divide `sqrt(400)` by `2m = 4`, not by 2.'],
          ['20', 'Divide `sqrt(4mk − b^2) = 20` by `2m = 4`.'],
          [['5.099', '5.1', 'sqrt(26)'], 'That is `ω_0 = sqrt(F{k}{m})`, the frequency without friction. With friction, `β = F{sqrt(4mk − b^2)}{2m}`.'],
          ['25', 'That is `β^2`. Take the square root.'],
          ['-5', 'Take `β` positive. The roots are `α ± βi`, so the `±` already carries the sign.']],
        hints: ['Use `β = F{sqrt(4mk − b^2)}{2m}`, with `4mk − b^2 = 416 − 16 = 400`.'] },
      { show: ['y = e^(−t)(C_1 cos 5t + C_2 sin 5t)', 'y(0) = C_1 = 0.5'] },
      { lead: 'Differentiate with the product rule, put in `t = 0`, and use `y′(0) = 0`.', ask: 'C_2 =', num: true, ans: '0.1',
        wrongs: [['0', 'The product rule gives two terms. At `t = 0`, `y′(0) = −C_1 + 5C_2`, not `5C_2` alone.'],
          ['-0.1', 'Solve `−0.5 + 5C_2 = 0`, which gives a positive `C_2`.'],
          ['2.5', 'Divide 0.5 by 5; do not multiply.'],
          ['0.5', 'That is `C_1`. Solve `−C_1 + 5C_2 = 0` for `C_2`.']],
        hints: ['At `t = 0`, `y′(0) = −C_1 + 5C_2`. Set it equal to 0.'],
        sol: ['`y′(0) = −C_1 + 5C_2 = −0.5 + 5C_2 = 0`, so `C_2 = 0.1`'] },
      { show: 'y = e^(−t)(0.5 cos 5t + 0.1 sin 5t)' },
      { lead: 'Find the decay rate, the rate at which the swings shrink.', ask: '"decay rate" =', num: true, ans: '1', also: ['1/s', '1 1/s', '1/sec'], units: 'per second', unitAlts: ['per s', '/s', '1/s'],
        wrongs: [['5', 'That is `β`, which sits inside the cosine and sets how fast the mass swings. The decay rate sits in the exponential.'],
          ['2', 'The decay rate is `F{b}{2m} = F{4}{4}`, not `F{b}{m}`.'],
          ['4', 'The decay rate is `F{b}{2m}`, not `b`.'],
          ['-1', 'A decay rate is stated as a positive number: the swings shrink like `e^(−1 · t)`, so the rate is 1 per second.'],
          [['e^(-t)', 'e^-t', 'e^(-1t)'], 'Type the rate as a number. The swings shrink like `e^(−t) = e^(−1 · t)`, so the rate is the 1 in the exponent.']],
        hints: ['The swings shrink like the exponential in front, `e^(αt)`.'],
        sol: ['`"decay rate" = F{b}{2m} = F{4}{4} = 1` per second'] },
      { lead: 'The swings shrink like `e^(−t)`. How long does it take them to halve? Keep two decimal places.', ask: 't ≈', num: true, ans: 'ln(2)', tol: 0.0051, units: 's', unitAlts: ['seconds', 'sec'], closeMsg: CLOSE2,
        wrongs: [[['0.14', '0.139', '0.1386'], 'That uses `β = 5`. The swings shrink like `e^(−t)`, so solve `e^(−t) = F{1}{2}`.'],
          [['1.44', '1.443', '1/ln(2)'], 'Taking `ln` of both sides of `e^(−t) = F{1}{2}` gives `−t = −ln 2`, so `t = ln 2`, not `F{1}{ln 2}`.'],
          [['0.35', '0.347', '0.3466'], 'That uses a decay rate of 2. Here the rate is 1, so solve `e^(−t) = F{1}{2}`.'],
          ['0.5', 'The decay is exponential, not linear. Solve `e^(−t) = F{1}{2}` with a logarithm.'],
          [['-0.69', '-0.693'], 'Time is positive: `−t = ln F{1}{2} = −ln 2`, so `t = ln 2`.']],
        hints: ['Solve `e^(−t) = F{1}{2}` by taking the natural logarithm of both sides.'],
        sol: ['`e^(−t) = F{1}{2}` gives `t = ln 2 ≈ 0.69` s'] },
      { lead: 'Find the quasi-period, the time from one peak to the next, in seconds. Give an exact value or keep two decimal places.', ask: '"quasi-period" =', num: true, ans: '2pi/5', tol: 0.0051, units: 's', unitAlts: ['seconds', 'sec'], closeMsg: CLOSE2,
        wrongs: [['5', 'That is `β`, in radians per second. One swing takes `F{2π}{β}` seconds.'],
          [['1.23', '1.232', '2pi/sqrt(26)'], 'That is the period without friction, `F{2π}{ω_0}`. With friction the swings repeat every `F{2π}{β}`.'],
          [['6.28', '6.283', '2pi'], 'That uses the decay rate, 1. The quasi-period uses `β = 5`, the number inside the cosine.'],
          [['0.8', '0.796', '0.7958'], 'That is `F{β}{2π}`, the swings per second. Take its reciprocal.'],
          [['31.42', '31.4', '10pi'], 'Divide `2π` by `β`; do not multiply.']],
        hints: ['`cos 5t` repeats each time `5t` grows by `2π`.'],
        sol: ['`"quasi-period" = F{2π}{β} = F{2π}{5} ≈ 1.26` s'] },
      { lead: 'With no friction, this mass would swing with period `F{2π}{sqrt(26)} ≈ 1.23` s. Why is the quasi-period longer?', ok: 0, pick: [
        ['Friction makes `β = 5` smaller than `ω_0 = sqrt(26)`, so each swing takes longer', 'Since `β^2 = ω_0^2 − F{b^2}{4m^2}`, friction always makes the swings slower as well as smaller.'],
        ['The swings are smaller, so they take longer', 'The size of a swing does not set its timing. That is set by `β`, and `β < ω_0`.'],
        ['It is not longer, because friction makes the mass swing faster', 'Compare `F{2π}{5} ≈ 1.26` with `F{2π}{sqrt(26)} ≈ 1.23`. Friction makes `β` smaller than `ω_0`, so the swings are slower.']] }],
    graph: { x: [0, 4], y: [-0.6, 0.6], ticks: { x: 0.5, y: 0.2 },
      fns: [{ f: function (t) { return Math.exp(-t) * (0.5 * Math.cos(5 * t) + 0.1 * Math.sin(5 * t)); }, n: 500 },
        { f: function (t) { return Math.sqrt(0.26) * Math.exp(-t); }, role: 'muted', dash: true },
        { f: function (t) { return -Math.sqrt(0.26) * Math.exp(-t); }, role: 'muted', dash: true }],
      dots: [{ x: 0, y: 0.5, label: '(0, 0.5)', at: 'ne' }],
      aria: 'The graph of y = e to the minus t times (0.5 cos 5t + 0.1 sin 5t) for t from 0 to 4 seconds. It starts at 0.5 and swings back and forth between two dashed curves that shrink toward 0, with peaks about 1.26 seconds apart.' },
    after: 'The swings stay inside the dashed envelope `±0.51e^(−t)`, which halves every `ln 2 ≈ 0.69` s, and the peaks come every `F{2π}{5} ≈ 1.26` s.' },

  /* 4. homogeneous plus particular, with a constant push: y_p, superposition fails, y_h, the general solution, steady state */
  { id: 'p4', sec: 'sec-forced', task: 'A 1 kg mass on a spring with `k = 14` N/m and damping coefficient `b = 9` N·s/m is pushed by a constant force of 35 N. Its position `y(t)`, in meters, satisfies the equation below.',
    board: 'y″ + 9y′ + 14y = 35', v: 't', teach: T_NONH,
    steps: [
      { lead: 'Look for a constant solution `y = A`, so that `y′ = y″ = 0`.', ask: 'A =', num: true, ans: '2.5', units: 'm', unitAlts: ['meters'],
        wrongs: [['35', 'With `y = A`, the equation is `14A = 35`. Divide by 14.'],
          ['0.4', 'Divide 35 by 14, not 14 by 35.'],
          [['3.889', '3.89', '35/9'], 'For a constant, `y′ = 0`, so the `9y′` term is 0. The equation is `14A = 35`.'],
          [['1.522', '1.52', '35/23'], 'Only the `14y` term is left, because `y′` and `y″` are 0 for a constant.']],
        hints: ['Put `y = A`, `y′ = 0` and `y″ = 0` into the equation.'],
        why: 'Stretched 2.5 m, the spring pulls back with `14 · 2.5 = 35` N, which exactly balances the push.' },
      { lead: 'A classmate says that `y = 5` is a solution too, since doubling a solution gives a solution. Is it?', ok: 0, pick: [
        ['No, because `14 · 5 = 70`, not 35', 'With a nonzero right side, doubling a solution doubles the left side too, so `y = 5` solves the equation with forcing 70.'],
        ['Yes, by superposition', 'Superposition holds only when the right side is 0. Check `y = 5`: the left side is `14 · 5 = 70`.'],
        ['Yes, because every constant solves the equation', 'A constant `A` gives `14A`, which equals 35 only for `A = 2.5`.']] },
      { lead: 'Now take the homogeneous equation, `y″ + 9y′ + 14y = 0`. Find the roots of its characteristic equation, with a comma between them.', ask: 'r =', list: true, ans: '-2, -7', teach: T_REAL,
        wrongs: [['2, 7', '`r^2 + 9r + 14 = (r + 2)(r + 7)`, so the roots are negative.'],
          [['-1, -14', '1, 14'], 'The two numbers must multiply to 14 and add to 9.']],
        hints: ['Factor `r^2 + 9r + 14`: find two numbers that multiply to 14 and add to 9.'] },
      { lead: 'Which formula gives every solution of the forced equation?', ok: 0, pick: [
        ['`y = C_1 e^(−2t) + C_2 e^(−7t) + 2.5`', 'Every solution is `y_h + y_p`: the homogeneous solution with its two constants, plus one particular solution.'],
        ['`y = C_1 e^(−2t) + C_2 e^(−7t)`', 'That solves `y″ + 9y′ + 14y = 0`, not the forced equation. Add the particular solution 2.5.'],
        ['`y = C_1 e^(−2t) + C_2 e^(−7t) + 2.5C_3`', 'Only `y_h` carries constants. The particular solution is the fixed function 2.5: with `C_3 = 2` this formula would give the false solution 5.'],
        ['`y = 2.5(C_1 e^(−2t) + C_2 e^(−7t))`', 'The particular solution is added to `y_h`, not multiplied by it. This formula gives 0 when `C_1 = C_2 = 0`, and 0 does not solve the forced equation.']] },
      { lead: 'Two solutions of the forced equation are `y = 2.5 + 3e^(−2t)` and `y = 2.5 − e^(−7t)`. Which equation does their difference, `3e^(−2t) + e^(−7t)`, solve?', ok: 0, pick: [
        ['`y″ + 9y′ + 14y = 0`', 'Each solution gives 35 on the left, so their difference gives `35 − 35 = 0`. That is why every solution is `y_p` plus a homogeneous solution.'],
        ['`y″ + 9y′ + 14y = 35`', 'Substitute the difference. The left side becomes `35 − 35`.'],
        ['`y″ + 9y′ + 14y = 70`', 'That is the equation their sum solves. Their difference gives `35 − 35`.']] },
      { lead: 'Wherever the mass starts, what happens to it as `t` grows?', ok: 0, pick: [
        ['It approaches `y = 2.5`, the steady state', 'Both `e^(−2t)` and `e^(−7t)` die out, so the transient vanishes and only `y_p = 2.5` is left.'],
        ['It returns to `y = 0`, its old rest position', 'The push keeps acting. The new rest position is where the spring force balances it, `y = 2.5`.'],
        ['Where it ends up depends on where it starts', 'The start sets `C_1` and `C_2`, which multiply terms that die out. The limit 2.5 does not depend on them.'],
        ['It swings about `y = 2.5` forever', 'The roots −2 and −7 are real, so `y_h` has no sines or cosines, and both of its terms die out.']] }],
    graph: { x: [0, 4], y: [0, 5.2], ticks: { x: 0.5, y: 1 },
      fns: [{ f: function (t) { return 2.5 - 3.5 * Math.exp(-2 * t) + Math.exp(-7 * t); } },
        { f: function (t) { return 2.5 + 3.5 * Math.exp(-2 * t) - Math.exp(-7 * t); } },
        { f: function (t) { return 2.5 - 0.9 * Math.exp(-2 * t) - 0.6 * Math.exp(-7 * t); }, role: 'inside' }],
      hlines: [{ y: 2.5, role: 'muted' }], texts: [{ x: 3.4, y: 2.5, text: 'y = 2.5', at: 'n' }],
      dots: [{ x: 0, y: 0 }, { x: 0, y: 5 }, { x: 0, y: 1 }],
      aria: 'Three solutions for t from 0 to 4 seconds. One starts at 0 at rest, one at 5 at rest, and one at 1 moving up. All three settle onto a dashed horizontal line at y = 2.5.' },
    after: 'Each solution is 2.5 plus a homogeneous solution. The homogeneous part dies out, so all three end at 2.5.' },

  /* 5. choosing the trial form, including the modification rule (simple and double root) */
  { id: 'p5', sec: 'sec-trial', task: 'Write the trial form for a particular solution `y_p` of each equation. Do not solve for the coefficients.',
    board: 'y″ + y′ − 20y = g(t)', v: 't', teach: T_UC,
    steps: [
      { lead: 'First find the homogeneous solutions. Type the roots of `r^2 + r − 20 = 0`, with a comma between them.', ask: 'r =', list: true, ans: '4, -5', teach: T_REAL,
        wrongs: [['-4, 5', '`r^2 + r − 20 = (r − 4)(r + 5)`, so the roots are 4 and −5.'],
          [['20, -1', '-20, 1'], 'The two numbers in the factors must multiply to −20 and add to 1.']],
        hints: ['Factor `r^2 + r − 20`: find two numbers that multiply to −20 and add to 1.'] },
      { show: 'y_h = C_1 e^(4t) + C_2 e^(−5t)' },
      { lead: 'Which trial form fits `g(t) = 3t^2`?', ok: 0, pick: [
        ['`At^2 + Bt + C`', 'Derivatives of `t^2` produce `t` and a constant, so the form needs every power up to `t^2`. No extra `t` is needed, because 0 is not a root.', T_UCPOL],
        ['`At^2`', 'Substituting gives `2A + 2At − 20At^2`. The `t` term and the constant have nothing on the right to match, so the form needs `Bt + C` too.', T_UCPOL],
        ['`t(At^2 + Bt + C)`', 'An extra `t` is needed only when part of the guess solves the homogeneous equation. For a polynomial that means 0 is a root, and the roots are 4 and −5.'],
        ['`3t^2`', 'A trial form has unknown coefficients for the substitution to decide. Substituting `3t^2` gives `6 + 6t − 60t^2`, not `3t^2`.']] },
      { lead: 'Which trial form fits `g(t) = 7e^(−5t)`?', ok: 0, pick: [
        ['`Ate^(−5t)`', '−5 is a simple root, so `Ae^(−5t)` solves the homogeneous equation. One factor of `t` fixes that.'],
        ['`Ae^(−5t)`', '`e^(−5t)` is part of `y_h`, so substituting `Ae^(−5t)` gives 0, never `7e^(−5t)`. Multiply by `t`.', T_UCMOD],
        ['`At^2 e^(−5t)`', '`t^2` is for a double root. −5 is a simple root, so one factor of `t` is enough.'],
        ['`Ae^(5t)`', 'The exponent comes from the forcing, `e^(−5t)`, sign included.']] },
      { lead: 'Which trial form fits `g(t) = 2cos 4t`?', ok: 0, pick: [
        ['`A cos 4t + B sin 4t`', 'A cosine needs its sine partner. No extra `t`: `cos 4t` would solve the homogeneous equation only if `±4i` were roots, and the roots are the real numbers 4 and −5.'],
        ['`t(A cos 4t + B sin 4t)`', 'The root 4 belongs to `e^(4t)`, not to `cos 4t`. A cosine at frequency 4 needs an extra `t` only when `±4i` are roots.'],
        ['`A cos 4t`', 'The `y′` term turns `cos 4t` into a sine, which nothing in `A cos 4t` can cancel. Add `B sin 4t`.', T_UCSIN],
        ['`Ae^(4t) cos 4t`', 'There is no `e^(4t)` in the forcing. A cosine alone needs `A cos 4t + B sin 4t`.']] },
      { lead: 'Which trial form fits `g(t) = 6t + e^(4t)`?', ok: 0, pick: [
        ['`At + B + Cte^(4t)`', 'Each part gets its own letters. Only the exponential overlaps `y_h`, because 4 is a root, so only it gets the extra `t`.'],
        ['`t(At + B) + Cte^(4t)`', 'Only the part that overlaps `y_h` gets the extra `t`. The polynomial `At + B` does not overlap it, because 0 is not a root.', T_UC],
        ['`At + B + Ce^(4t)`', '4 is a root, so `Ce^(4t)` solves the homogeneous equation and gives 0. Multiply that part by `t`.'],
        ['`At + Cte^(4t)`', 'The polynomial part needs every power up to `t`, so it is `At + B`.']] },
      { lead: 'Now take a different left side: `y″ − 10y′ + 25y = 9e^(5t)`. Its characteristic polynomial is `r^2 − 10r + 25 = (r − 5)^2`. Which trial form fits?', ok: 0, pick: [
        ['`At^2 e^(5t)`', '5 is a double root, so both `e^(5t)` and `te^(5t)` solve the homogeneous equation. Multiply by `t^2`.'],
        ['`Ate^(5t)`', 'With a double root, `y_h = (C_1 + C_2 t)e^(5t)`, so `te^(5t)` solves the homogeneous equation too. Multiply by `t^2`.', T_REP],
        ['`Ae^(5t)`', '5 is a root, so `Ae^(5t)` gives 0. It is a double root, so multiply by `t^2`.'],

/* ================================ builder (keep unchanged when copying) ================================ */
/* PARENTHESIS SLIPS. Typing x+3/x+4 for (x + 3)/(x + 4) is the commonest typing slip, and the engine's "Reads as" line
   prints it inline, so the student cannot see it. For every expression key with a parenthesized top or bottom beside "/",
   the forms with those parentheses dropped (top, bottom, both) become wrong answers with PAREN_MSG, unless the row
   already lists them or they are equal to the key. Nothing to write per problem. */
var PAREN_MSG = 'Without parentheses, `/` divides only the term right next to it, so the computer reads that answer differently from what you meant. Put a whole top or bottom in parentheses, as in ⟦(top)/(bottom)⟧.';
function partner(s, i, dir) {
  for (var d = 0, j = i; j >= 0 && j < s.length; j += dir) { var c = s.charAt(j); if (c === '(') d += dir; else if (c === ')') d -= dir; if (d === 0) return j; }
  return -1;
}
function parenSlips(key) {
  var s = String(key).replace(/\s+/g, ''), out = [];
  for (var i = 0; i < s.length; i++) {
    if (s.charAt(i) !== '/') continue;
    var pairs = [], a = s.charAt(i - 1) === ')' ? partner(s, i - 1, -1) : -1, b = s.charAt(i + 1) === '(' ? partner(s, i + 1, 1) : -1;
    if (a >= 0 && !/[a-z]/i.test(s.charAt(a - 1))) pairs.push([a, i - 1]);     /* a top in parentheses, not sqrt(...) */
    if (b >= 0) pairs.push([i + 1, b]);
    var sets = pairs.length === 2 ? [[pairs[0]], [pairs[1]], pairs] : pairs.map(function (q) { return [q]; });
    sets.forEach(function (set) {
      var drop = []; set.forEach(function (q) { drop.push(q[0], q[1]); });
      out.push(s.split('').filter(function (c, n) { return drop.indexOf(n) < 0; }).join(''));
    });
  }
  return out;
}
function addParenSlips(item) {
  if (item.num || typeof item.ans !== 'string') return;
  var add = parenSlips(item.ans).filter(function (f) { return judge(item, f).st === 'no'; });
  if (add.length) item.wrongs = (item.wrongs || []).concat([[add, PAREN_MSG]]);
}
/* EXPONENT SLIPS (added for DiffEq, 2026-10-26). Typing e^-2t for e^(−2t) is the DiffEq version of the slip above: MathKit
   reads e^-2t as e^(−2) · t and e^2t^3 as e^2 · t^3. For every expression key with a parenthesized exponent "^(...)",
   the forms with those parentheses dropped (each one, then all) become wrong answers with EXP_MSG, unless the engine
   already judges them some other way. */
var EXP_MSG = 'Without parentheses, ⟦^⟧ raises only the next number or letter, so the computer reads that answer differently from what you meant. Put a whole exponent in parentheses, as in ⟦e^(-2t)⟧.';
function expSlips(key) {
  var s = String(key).replace(/\s+/g, ''), groups = [], out = [];
  for (var i = 0; i < s.length - 1; i++) if (s.charAt(i) === '^' && s.charAt(i + 1) === '(') { var j = partner(s, i + 1, 1); if (j > 0) groups.push([i + 1, j]); }
  function drop(gs) { var d = []; gs.forEach(function (g) { d.push(g[0], g[1]); }); return s.split('').filter(function (c, n) { return d.indexOf(n) < 0; }).join(''); }
  groups.forEach(function (g) { out.push(drop([g])); });
  if (groups.length > 1) out.push(drop(groups));
  return out;
}
function addExpSlips(item) {
  if (item.num || typeof item.ans !== 'string') return;
  var add = expSlips(item.ans).filter(function (f) { return judge(item, f).st === 'no'; });
  if (add.length) item.wrongs = (item.wrongs || []).concat([[add, EXP_MSG]]);
}

/* STRAY LETTERS (added by the DiffEq novice read, 2026-10-26). For a letter it cannot read the engine says "This box uses t as
   its only variable, so “c” is not something it can read", which does not tell a student who typed Ce^(-2t) into "y_h = C ·"
   what to change. Before the engine judges, a row's stray letters get their own message, and it costs no try:
   a letter written just before the box ("C ·", "S ·") gets factorMsg; a C in any expression row without upToC gets C_MSG;
   a step may list more as stray: [[letter, message], ...]. Function names (ln, exp, sqrt, sin, ...) are ignored. */
var C_MSG = 'This box takes no `C`. Use the initial value to find the number `C`, and type that number in its place.';
function factorMsg(L) { return 'The `' + L + '` is already written before the box. Type only what multiplies it.'; }
var FN_NAMES = /arcsin|arccos|arctan|sqrt|sin|cos|tan|sec|csc|cot|exp|ln|log|abs|pi/gi;
function addStrays(item) {
  var list = (item.stray || []).slice(), m = /([A-Za-z])\s*·\s*$/.exec(String(item.ask));
  if (m) list.unshift([m[1], factorMsg(m[1])]);
  if (!item.num && !item.upToC && !list.some(function (x) { return x[0].toLowerCase() === 'c'; })) list.push(['C', C_MSG]);
  item.stray = list;
}
function strayProblem(item, raw) {
  if (!item || !item.stray || !item.stray.length) return null;
  var s = String(raw); s = (s.indexOf('=') >= 0 ? s.slice(s.lastIndexOf('=') + 1) : s).replace(FN_NAMES, ' ').toLowerCase();
  for (var i = 0; i < item.stray.length; i++) if (s.indexOf(item.stray[i][0].toLowerCase()) >= 0) return item.stray[i][1];
  return null;
}
/* A WAY FORWARD (added by the DiffEq novice read, 2026-10-26). With no sol, a student who misses a row twice and is not helped
   by its hint can go no further: every later step of the problem stays locked. Every typed row now carries a sol, so the
   engine offers "Show the solution" after two tries; by default it is the finished line, ask then key, with a decimal for a
   number key written as an expression. A step may give its own sol: ['math line', ...]. */
function solLine(item) {
  var k = String(alts(item.ans)[0]), ask = String(item.ask), unit = item.units || item.unit;
  if (item.num && !/^-?\d+(\.\d+)?$/.test(k)) {
    var c = mk.compile(k, { v: 't' }), val = c.f ? c.f(0) : NaN;
    k = (/≈\s*$/.test(ask) ? '' : '≈ ') + String(+val.toFixed(4));
  } else {
    var tok = '(\\([^()]*\\)|[A-Za-z0-9.|]+(?:\\^(?:\\([^()]*\\)|[A-Za-z0-9.]+))?)';
    var unp = function (x) { return /^\(.*\)$/.test(x) ? x.slice(1, -1) : x; };
    k = k.replace(new RegExp(tok + '\\s*/\\s*' + tok, 'g'), function (m0, a, b) { return 'F{' + unp(a) + '}{' + unp(b) + '}'; });
  }
  k = k.replace(/-/g, '−').replace(/\*/g, ' · ');
  return '`' + ask + ' ' + k + '`' + (unit ? ' ' + unit : '');
}

function stepId(p, k) { return p.id + '-' + (k + 1); }
/* register every typed row as an engine item and every choice in MCS at load, so the checks see all of them, gated or not */
function registerProblems() {
  PROBLEMS.forEach(function (p, n) {
    p.num = n + 1;
    var typedIds = [];
    p.steps.forEach(function (st, k) {
      var id = stepId(p, k);
      if (st.pick) { MCS[id] = { opts: st.pick, ok: st.ok, blk: p.id }; return; }
      if (st.show) return;
      var item = {};
      Object.keys(st).forEach(function (key) { if (['lead', 'why', 'at'].indexOf(key) < 0) item[key] = st[key]; });
      if (!item.v && p.v && !item.num) item.v = p.v;
      if (!item.teach) item.teach = p.teach;
      if (st.why) item.okNote = st.why;
      if (st.at !== undefined) item.at = st.at;
      reg(id, item, p.id);
      addParenSlips(item);
      addExpSlips(item);
      addStrays(item);
      if (!item.sol) item.sol = [solLine(item)];
      typedIds.push(id);
    });
    typedIds.forEach(function (id, k) { ITEMS[id].nextId = typedIds[k + 1] || null; });
  });
}
registerProblems();

/* is step k of problem p answered correctly? */
function stepDone(p, k) {
  var st = p.steps[k], id = stepId(p, k);
  if (st.show) return true;
  if (st.pick) return S.pick[id] === st.ok;
  return !!S.done[id];
}
function problemDone(p) { return p.steps.every(function (st, k) { return stepDone(p, k); }); }

/* the closing figure: a static plot with the page's defaults filled in */
function problemGraph(p) {
  var g = {}, d = { w: 380, h: 240, grid: true, labels: { x: p.v || 'x' } };   /* no y title: it runs into the top tick label */
  Object.keys(d).forEach(function (k) { g[k] = d[k]; });
  Object.keys(p.graph).forEach(function (k) { g[k] = p.graph[k]; });
  return figure('fig-' + p.id, plot(g), p.after);
}

/* one problem card: the board, then each step in order until the first one not yet answered */
function problemHTML(p) {
  var h = p.task ? '<p class="ptext">' + P(p.task) + '</p>' : '';
  h += '<div class="pboard">' + show([].concat(p.board)) + '</div>';
  var open = true, lines = [];
  function flush() { if (lines.length) { h += show(lines); lines = []; } }
  for (var k = 0; k < p.steps.length && open; k++) {
    var st = p.steps[k], id = stepId(p, k);
    if (st.show) { lines = lines.concat(st.show); continue; }
    flush();
    h += '<div class="pstep' + (stepDone(p, k) ? ' ok' : '') + '">' + (st.lead ? '<p class="plead">' + P(st.lead) + '</p>' : '');
    h += st.pick ? choice(id, st.pick, st.ok, p.id) : '<div class="srow tr fr-row' + (S.done[id] ? ' ok' : '') + '"><div class="sval">' + typed(id) + '</div></div>';
    h += '</div>';
    open = stepDone(p, k);
  }
  flush();
  if (!open) h += '<p class="locked">' + (p.steps.slice(k).some(function (st) { return !st.show; }) ? 'Answer this step to open the next one.' : 'Answer this step to finish the problem.') + '</p>';
  else if (p.graph) h += problemGraph(p);
  return card('Problem ' + p.num + (problemDone(p) ? ' · Done' : ''), h, 'ex-' + p.id, { cls: 'prob' + (problemDone(p) ? ' pdone' : '') });
}

/* FORM GUARDS. The engine judges an expression by its values, so a typed row asking for the rewritten form would accept the
   unrewritten one. Before the engine's own Check runs, a capture listener judges the answer; if the engine would call it
   correct but the row's guard rejects its form, the row shows the guard's diagnosis instead and counts a try. */
function formProblem(item, raw) {
  if (!item || (item.at === undefined && !item.form)) return null;
  if (judge(item, raw).st !== 'ok') return null;
  if (item.form) { var m = item.form(raw); if (m) return m; }
  if (item.at !== undefined) {
    var v = String(raw).indexOf('=') >= 0 ? String(raw).slice(String(raw).lastIndexOf('=') + 1) : String(raw);
    var c = mk.compile(v, vopt(item)), y = c.f ? c.f(item.at) : 0;
    if (!isFinite(y)) {
      var t = item.v || 'x';
      return 'That is equal to the original, but it still gives `F{0}{0}` at `' + t + ' = ' + item.at + '`. Cancel the common factor and type what is left.';
    }
  }
  return null;
}
function formCheck(id) {
  var item = ITEMS[id], el = document.getElementById('in-' + id); if (!item || !el) return false;
  var pre = strayProblem(item, el.value);
  if (pre) {   /* a stray letter: like the engine's own parse messages, it costs no try and opens no hint */
    S.ans[id] = el.value; S.res[id] = { st: 'err', msg: pre, md: true };
    save(); redraw(item.blk);
    var at = document.getElementById('in-' + id); if (at) at.focus();
    return true;
  }
  var m = formProblem(item, el.value); if (!m) return false;
  S.ans[id] = el.value; S.res[id] = { st: 'slip', msg: m }; S.tries[id] = (S.tries[id] || 0) + 1;
  save(); redraw(item.blk);
  var me = document.getElementById('in-' + id); if (me) me.focus();
  return true;
}
document.addEventListener('click', function (e) {
  var b = e.target && e.target.closest && e.target.closest('[data-act="check"]');
  if (b && formCheck(b.dataset.id)) { e.stopPropagation(); e.preventDefault(); }
}, true);
document.addEventListener('keydown', function (e) {
  var t = e.target;
  if (e.key === 'Enter' && t && t.classList && t.classList.contains('minput') && formCheck(t.dataset.id)) { e.stopPropagation(); e.preventDefault(); }
}, true);

/* ---------------- page ---------------- */
function sectionHTML(s, n) {
  var ps = PROBLEMS.filter(function (p) { return p.sec === s.id; });
  return sec(s.id, String(n + 1), s.title, s.lede) + col(ps.map(function (p) { return blk(p.id, function () { return problemHTML(p); }); }).join(''));
}
var NAV = { 'sec-spring': 'Spring', 'sec-damp': 'Damping', 'sec-forced': 'Forced', 'sec-trial': 'Trial Form', 'sec-coef': 'Coefficients', 'sec-ivp': 'IVP' };
function backHTML() {
  return sec('sec-back', '', 'Back to the Unit', '') + prose('', [
    'If one kind of problem gave you trouble, redo its example on the Unit 6 Worked Examples page, then try the practice problem under that example.',
    'Next, complete Problem Set 6, Part 1. For a second explanation of any step, read Paul’s [Mechanical Vibrations](' + T_VIB[0] + ') page or his [Undetermined Coefficients](' + T_UC[0] + ') page on the same topic.']);
}
function page() {
  return header('Unit 6 Practice', SECTIONS_P.map(function (s) { return ['#' + s.id, NAV[s.id]]; }).concat([['#sec-back', 'Back']])) +
    '<main id="top">' + hero({ kicker: 'Differential Equations · Unit 6', title: 'Unit 6 Practice: Oscillation and Undetermined Coefficients',
      dek: 'Use this page after the Unit 6 Worked Examples, to practice the steps with feedback on each line. Each line is checked before the next one opens. Type a power with ⟦^⟧, as in ⟦t^2⟧, put a whole exponent in parentheses, as in ⟦e^(3t)⟧, and put a whole top or bottom in parentheses, as in ⟦pi/(2 · 3)⟧. Type π as ⟦pi⟧, and separate two roots with a comma, as in ⟦1, -3⟧.' }) +
    SECTIONS_P.map(sectionHTML).join('') + backHTML() + '</main>';
}
expose({ PROBLEMS: PROBLEMS, problemHTML: problemHTML, formProblem: formProblem, strayProblem: strayProblem, stepDone: stepDone });
mount(page());

/* Unit 6 Practice: Oscillation and Undetermined Coefficients: page-specific self-checks for the practice-page builder (ENGINE.md section 5).
   Copied from DiffEq's practice-unit-03 (itself from Calc I's). They test the builder, so a page copied from this one keeps them unchanged, except
   GUARD_CASES, STRAY_CASES and LIVE_GUARD below, which name this page's item ids and must be rewritten for the new problems. */

/* [item id, typed answer, should the form guard refuse it?]. This page asks for no rewritten form, so it has no guards. */
var GUARD_CASES = [];
/* [item id, typed answer, the stray-letter message it should get, or null] */
var STRAY_CASES = [['p7-3', 'Ae^(3t) + 3Ate^(3t)', factorMsg('A')], ['p7-4', 'A(6e^(3t) + 9te^(3t))', factorMsg('A')], ['p7-7', 'Ate^(3t)', 'Put in the number you found for `A`. This box takes only `t`.'],
  ['p6-6', '-Acos(t) + Bsin(t)', AB_MSG], ['p6-6', 'C_1cos(t) + sin(t)', YP_C], ['p6-6', 'sin(t) - cos(t) + C', YP_C], ['p6-6', 'sin(t) - cos(t)', null], ['p7-3', 'e^(3t) + 3te^(3t)', null], ['p7-7', '2te^(3t)', null], ['p7-4', '6e^(3t)+9te^(3t)', null]];
/* a guarded row, an answer the guard refuses, and a phrase its diagnosis contains: typed and checked in the live DOM.
   null on this page: no row has a form guard. */
var LIVE_GUARD = null;

/* render one problem's block with that problem's progress set by fn(state), leaving S untouched */
function renderWith(p, fn) {
  var snap = selfcheck.snapshot(), html = '';
  try {
    p.steps.forEach(function (st, k) { var id = stepId(p, k); delete S.done[id]; delete S.res[id]; delete S.ans[id]; delete S.pick[id]; });
    fn();
    html = BLOCKS[p.id]();
  } finally { selfcheck.restore(snap, []); }
  return html;
}
function answerAll(p) {
  p.steps.forEach(function (st, k) {
    var id = stepId(p, k);
    if (st.pick) S.pick[id] = st.ok;
    else if (!st.show) { S.done[id] = true; S.res[id] = { st: 'ok' }; S.ans[id] = String(alts(ITEMS[id].ans)[0]); }
  });
}

selfcheck.add('steps are gated: with no progress only the first step of each problem shows', function () {
  var bad = [];
  PROBLEMS.forEach(function (p) {
    var h = renderWith(p, function () {}), first = stepId(p, 0), second = stepId(p, 1);
    var hasFirst = h.indexOf('id="mc-' + first + '"') >= 0 || h.indexOf('id="in-' + first + '"') >= 0;
    var hasSecond = h.indexOf('id="mc-' + second + '"') >= 0 || h.indexOf('id="in-' + second + '"') >= 0;
    if (!hasFirst || hasSecond) bad.push(p.id + (hasFirst ? ' shows step 2 early' : ' hides step 1'));
  });
  return bad.length ? { ok: false, detail: bad.join('; ') } : { ok: true, detail: PROBLEMS.length + ' problems' };
});

selfcheck.add('a finished problem shows every step, Done and its closing figure; an unfinished one shows no figure', function () {
  var bad = [];
  PROBLEMS.forEach(function (p) {
    var done = renderWith(p, function () { answerAll(p); }), fresh = renderWith(p, function () {});
    var last = stepId(p, p.steps.length - 1), lastShown = done.indexOf('id="mc-' + last + '"') >= 0 || done.indexOf('id="in-' + last + '"') >= 0 || !!p.steps[p.steps.length - 1].show;
    if (!lastShown) bad.push(p.id + ' last step missing when answered');
    if (done.indexOf('· Done') < 0) bad.push(p.id + ' not marked Done');
    if (p.graph && done.indexOf('id="fig-' + p.id + '"') < 0) bad.push(p.id + ' figure missing when answered');
    if (fresh.indexOf('id="fig-' + p.id + '"') >= 0) bad.push(p.id + ' figure shows before the work is done');
  });
  return bad.length ? { ok: false, detail: bad.join('; ') } : true;
});

selfcheck.add('form guards reject equal but unrewritten answers and pass rewritten ones', function () {
  var bad = GUARD_CASES.filter(function (c) { return !!formProblem(ITEMS[c[0]], c[1]) !== c[2]; }).map(function (c) { return c[0] + ' "' + c[1] + '" ' + (c[2] ? 'passed' : 'was rejected'); });
  return bad.length ? { ok: false, detail: bad.join('; ') } : { ok: true, detail: GUARD_CASES.length + ' cases' };
});

selfcheck.add('typing an unsimplified answer into a guarded row and pressing Check shows the guard diagnosis', async function () {
  if (!LIVE_GUARD) return { ok: true, detail: 'no guarded rows on this page' };
  var p = PROBLEMS.filter(function (q) { return q.id === LIVE_GUARD.p; })[0], snap = selfcheck.snapshot();
  var k = +LIVE_GUARD.id.split('-')[1] - 1;
  answerAll(p); p.steps.slice(k).forEach(function (st, n) { var id = stepId(p, k + n); delete S.done[id]; delete S.res[id]; delete S.ans[id]; delete S.pick[id]; });
  redraw(p.id);
  var inp = document.getElementById('in-' + LIVE_GUARD.id), fb = 'no input';
  if (inp) {
    inp.value = LIVE_GUARD.raw; inp.dispatchEvent(new Event('input', { bubbles: true }));
    document.querySelector('[data-act="check"][data-id="' + LIVE_GUARD.id + '"]').click();
    await new Promise(function (r) { setTimeout(r, 50); });
    fb = (document.getElementById('fb-' + LIVE_GUARD.id) || {}).textContent || 'no feedback';
  }
  selfcheck.restore(snap, [p.id]);
  return fb.indexOf(LIVE_GUARD.says) >= 0 ? true : { ok: false, detail: fb };
});

selfcheck.add('right options are not all in one position', function () {
  var at = Object.keys(MCS).map(function (id) { return order(id, MCS[id].opts.length).indexOf(MCS[id].ok); });
  var firsts = at.filter(function (q) { return q === 0; }).length;
  return firsts < at.length * 0.6 ? { ok: true, detail: firsts + ' of ' + at.length + ' first' } : { ok: false, detail: firsts + ' of ' + at.length + ' choices put the right option first' };
});

selfcheck.add('a fraction typed without its parentheses gets the parentheses diagnosis', function () {
  var rows = Object.keys(ITEMS).filter(function (id) { return parenSlips(ITEMS[id].ans).length && !ITEMS[id].num; }), bad = [], n = 0;
  rows.forEach(function (id) {
    var w = (ITEMS[id].wrongs || []).filter(function (x) { return x[1] === PAREN_MSG; })[0];
    if (!w) return;
    alts(w[0]).forEach(function (f) { n++; var r = judge(ITEMS[id], f); if (r.st !== 'slip' || r.msg !== PAREN_MSG) bad.push(id + ' "' + f + '" -> ' + r.st); });
  });
  if (!n) return { ok: true, detail: 'no expression key on this page has a parenthesized top or bottom' };
  return bad.length ? { ok: false, detail: bad.join('; ') } : { ok: true, detail: n + ' slips on ' + rows.length + ' rows' };
});

/* DiffEq additions */
selfcheck.add('an exponent typed without its parentheses gets the exponent diagnosis', function () {
  var bad = [], n = 0, rows = 0;
  Object.keys(ITEMS).forEach(function (id) {
    var w = (ITEMS[id].wrongs || []).filter(function (x) { return x[1] === EXP_MSG; })[0];
    if (!w) return;
    rows++;
    alts(w[0]).forEach(function (f) { n++; var r = judge(ITEMS[id], f); if (r.st !== 'slip' || r.msg !== EXP_MSG) bad.push(id + ' "' + f + '" -> ' + r.st); });
  });
  if (!n) return { ok: false, detail: 'no row carries an exponent slip' };
  if (judge(ITEMS['p7-3'], 'e^3t + 3te^3t').msg !== EXP_MSG) bad.push('p7-3 "e^3t + 3te^3t" does not get the exponent diagnosis');
  return bad.length ? { ok: false, detail: bad.join('; ') } : { ok: true, detail: n + ' slips on ' + rows + ' rows' };
});

selfcheck.add('no typed key contains an arbitrary constant', function () {
  var bad = Object.keys(ITEMS).filter(function (id) { return keysOf(ITEMS[id]).some(function (k) { return /(^|[^a-z])[ck]([^a-z]|$)/i.test(String(k)); }); });
  return bad.length ? { ok: false, detail: 'constant in the key of ' + bad.join(', ') } : { ok: true, detail: Object.keys(ITEMS).length + ' rows' };
});

selfcheck.add('an antiderivative row accepts the answer with + C', function () {
  var rows = Object.keys(ITEMS).filter(function (id) { return ITEMS[id].upToC; });
  var bad = rows.filter(function (id) { return judge(ITEMS[id], String(ITEMS[id].ans) + ' + C').st !== 'ok'; });
  if (!rows.length) return { ok: true, detail: 'no antiderivative rows on this page' };
  return bad.length ? { ok: false, detail: bad.join(', ') + ' refuse the key plus C' } : { ok: true, detail: rows.length + ' rows' };
});

/* novice read, 2026-10-26 */
selfcheck.add('stray letters get their own message, and never hide a key or a listed wrong answer', function () {
  var bad = STRAY_CASES.filter(function (c) { return strayProblem(ITEMS[c[0]], c[1]) !== c[2]; }).map(function (c) { return c[0] + ' "' + c[1] + '" -> ' + strayProblem(ITEMS[c[0]], c[1]); });
  Object.keys(ITEMS).forEach(function (id) {
    var it = ITEMS[id];
    keysOf(it).concat.apply(keysOf(it), (it.wrongs || []).map(function (w) { return alts(w[0]); })).forEach(function (a) { if (strayProblem(it, a)) bad.push(id + ' "' + a + '" is swallowed by a stray-letter message'); });
  });
  return bad.length ? { ok: false, detail: bad.join('; ') } : { ok: true, detail: STRAY_CASES.length + ' cases' };
});

selfcheck.add('every typed row offers a solution after two tries', function () {
  var bad = Object.keys(ITEMS).filter(function (id) { return !ITEMS[id].isRep && !(ITEMS[id].sol && ITEMS[id].sol.length && String(ITEMS[id].sol[0]).indexOf('NaN') < 0); });
  return bad.length ? { ok: false, detail: 'no solution on ' + bad.join(', ') } : { ok: true, detail: Object.keys(ITEMS).length + ' rows' };
});

})();
</script>
